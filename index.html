<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ذادريــم</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#050505;color:#fff;font-family:Tahoma,Arial,sans-serif;min-height:100vh}
.wrap{width:min(680px,92%);margin:auto;padding:22px 0 35px}.top{height:44px;display:flex;justify-content:flex-end}
#adminBtn{display:none;background:#090909;color:#fff;border:1px solid #f22;border-radius:12px;padding:10px 18px;font-weight:bold;cursor:pointer;box-shadow:0 0 20px #500}
header{text-align:center;margin:8px 0 28px}.logo{font-size:clamp(42px,11vw,68px);font-weight:1000;text-shadow:0 0 8px #fff,0 0 22px red,0 0 45px #500}.sub{color:#ddd}
.links{display:grid;gap:16px}.link{display:block;text-decoration:none;color:#fff;text-align:center;padding:18px;border:1px solid #f22;border-radius:17px;background:linear-gradient(145deg,#171717,#070707);box-shadow:0 9px 0 #350000,0 0 22px #300;font-size:18px;font-weight:900;transition:.18s}.link:hover{transform:translateY(-4px);box-shadow:0 13px 0 #350000,0 0 30px #500}.link:active{transform:translateY(4px)}
#empty{display:none;text-align:center;color:#888}.remember{text-align:center;margin-top:30px;font-size:18px;font-weight:bold;text-shadow:0 0 12px red}footer{text-align:center;color:#777;font-size:12px;margin-top:38px}
.modal{display:none;position:fixed;inset:0;background:#000d;backdrop-filter:blur(7px);z-index:5;padding:20px;overflow:auto}.panel{width:min(650px,100%);margin:4vh auto;background:#0b0b0b;border:1px solid #f22;border-radius:20px;padding:22px;box-shadow:0 0 45px #500}.close{float:left;background:#171717;color:#fff;border:1px solid #444;border-radius:9px;padding:7px 12px;cursor:pointer}.panel h2{text-align:center;margin:0 0 18px}.form{display:grid;gap:9px;margin-bottom:18px}input{background:#050505;color:#fff;border:1px solid #511;border-radius:10px;padding:13px;outline:0}button.action{background:#b00;color:#fff;border:0;border-radius:10px;padding:12px;font-weight:bold;cursor:pointer}.status{text-align:center;color:#999;font-size:12px;min-height:18px}.item{background:#111;border:1px solid #311;border-radius:13px;padding:12px;margin-top:10px}.name{font-weight:bold;margin-bottom:7px}.url{font-size:12px;color:#888;word-break:break-all;margin-bottom:9px}.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}.row button{background:#181818;color:#fff;border:1px solid #511;border-radius:8px;padding:9px;cursor:pointer}.danger{color:#ff7777!important}@media(max-width:520px){.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><button id="adminBtn">إدارة</button></div>
<header><div class="logo">ذاسـويـم</div><div class="sub">صليت على النبي اليوم ﷺ..؟</div></header>
<div id="links" class="links"></div><div id="empty">لا توجد روابط حالياً</div>
<div class="remember">اذكر الله 🤍</div><footer>جميع الحقوق محفوظة لـ Anas X ذادريـم ©</footer>
</div>
<div id="modal" class="modal"><div class="panel">
<button class="close" id="close">إغلاق</button><h2>إدارة الموقع</h2>
<div class="form"><input id="newName" placeholder="اسم الرابط"><input id="newUrl" placeholder="https://example.com"><button class="action" id="add">+ إضافة رابط</button><div id="status" class="status"></div></div>
<div id="adminList"></div>
</div></div>
<script>
const URL="https://zgenhukwuqraondkctji.supabase.co";
const KEY="sb_publishable_iHNEAG2s91ImkGPT8jQDUg_dkmq4dIn";
const OWNER="anoos1an1@gmail.com";
const db=supabase.createClient(URL,KEY);
let owner=false,rows=[];
const $=id=>document.getElementById(id);
function norm(u){u=u.trim();return /^https?:\/\//i.test(u)?u:"https://"+u}
function render(){
 $("links").innerHTML="";
 $("empty").style.display=rows.length?"none":"block";
 rows.forEach(r=>{let a=document.createElement("a");a.className="link";a.href=norm(r.url);a.target="_blank";a.rel="noopener noreferrer";a.textContent=r.name;$("links").appendChild(a)});
 if(owner) adminRender();
}
function adminRender(){
 $("adminList").innerHTML="";
 rows.forEach(r=>{
  let d=document.createElement("div");d.className="item";
  d.innerHTML='<div class="name"></div><div class="url"></div><div class="row"><button>تغيير الاسم</button><button>تغيير الرابط</button><button class="danger">حذف</button></div>';
  d.querySelector(".name").textContent=r.name;d.querySelector(".url").textContent=r.url;
  d.querySelectorAll("button")[0].onclick=async()=>{let x=prompt("الاسم الجديد:",r.name);if(x&&x.trim()){let z=await db.from("links").update({name:x.trim(),updated_at:new Date().toISOString()}).eq("id",r.id);if(z.error)alert(z.error.message);await load()}};
  d.querySelectorAll("button")[1].onclick=async()=>{let x=prompt("الرابط الجديد:",r.url);if(x&&x.trim()){let z=await db.from("links").update({url:norm(x),updated_at:new Date().toISOString()}).eq("id",r.id);if(z.error)alert(z.error.message);await load()}};
  d.querySelectorAll("button")[2].onclick=async()=>{if(confirm('حذف "'+r.name+'"?')){let z=await db.from("links").delete().eq("id",r.id);if(z.error)alert(z.error.message);await load()}};
  $("adminList").appendChild(d);
 })
}
async function load(){let z=await db.from("links").select("*").order("sort_order",{ascending:true}).order("created_at",{ascending:true});if(!z.error){rows=z.data||[];render()}}
async function session(){let z=await db.auth.getSession();owner=z.data.session?.user?.email?.toLowerCase()===OWNER.toLowerCase();$("adminBtn").style.display=owner?"block":"none"}
$("adminBtn").onclick=()=>{if(owner){$("modal").style.display="block";adminRender()}}
$("close").onclick=()=>$("modal").style.display="none";
$("modal").onclick=e=>{if(e.target===$("modal"))$("modal").style.display="none"};
$("add").onclick=async()=>{if(!owner)return;let n=$("newName").value.trim(),u=$("newUrl").value.trim();if(!n||!u){$("status").textContent="اكتب الاسم والرابط";return}let max=rows.reduce((m,r)=>Math.max(m,Number(r.sort_order)||0),-1);let z=await db.from("links").insert({name:n,url:norm(u),sort_order:max+1});if(z.error){$("status").textContent=z.error.message;return}$("newName").value="";$("newUrl").value="";$("status").textContent="تمت الإضافة";await load()};
db.auth.onAuthStateChange(async()=>{await session();await load()});
(async()=>{await session();await load();db.channel("links-live").on("postgres_changes",{event:"*",schema:"public",table:"links"},load).subscribe()})();
</script>
</body>
</html>
